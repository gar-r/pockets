name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Run unit tests
        run: make test

      - name: Compile-check Lua files
        run: find . -name '*.lua' -not -path './dist/*' -exec luac5.1 -p {} +